    <linearGradient id="moon" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#d9d0ea"/></linearGradient>
    <linearGradient id="word" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#e3cfff"/><stop offset="1" stop-color="#9b6cff"/></linearGradient>
  </defs>
  <rect width="1280" height="360" rx="28" fill="#0d0b12"/>
