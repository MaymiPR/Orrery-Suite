<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" width="1280" height="640">
  <rect width="1280" height="640" fill="#0d0b12"/>
  <g transform="translate(0 110)">
  <defs>
    <radialGradient id="core" cx=".4" cy=".35" r=".7"><stop offset="0" stop-color="#ffffff"/><stop offset=".35" stop-color="#e3cfff"/><stop offset="1" stop-color="#9b6cff"/></radialGradient>
    <radialGradient id="halo"><stop offset="0" stop-color="#b993ff" stop-opacity=".55"/><stop offset="1" stop-color="#b993ff" stop-opacity="0"/></radialGradient>
    <linearGradient id="moon" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#d9d0ea"/></linearGradient>
    <linearGradient id="fade" x1="0" y1="0" x2="1280" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/>
      <stop offset="0.18" stop-color="#fff" stop-opacity="1"/>
      <stop offset="0.82" stop-color="#fff" stop-opacity="1"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <mask id="fadeEnds"><rect width="1280" height="420" fill="url(#fade)"/></mask>
  </defs>

  <!-- the orrery: two flattened orbits across the page, the outer one lit as a crescent, a planet on the inner one -->
  <g mask="url(#fadeEnds)">
    <ellipse cx="640" cy="270" rx="600" ry="74" fill="none" stroke="#6c6380" stroke-width="2"/>
    <ellipse cx="640" cy="270" rx="330" ry="44" fill="none" stroke="#6c6380" stroke-width="2" stroke-dasharray="2 7" stroke-linecap="round"/>
    <path d="M120 307 A600 74 0 0 0 1160 307 A600 58 0 0 1 120 307 Z" fill="url(#moon)"/>
  </g>
  <circle cx="640" cy="270" r="62" fill="url(#halo)"/>
  <circle cx="640" cy="270" r="22" fill="url(#core)"/>
  <circle cx="878" cy="240" r="8" fill="#c9a5ff"/>

  <!-- wordmark -->
  <g font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" text-anchor="middle">
    <text x="640" y="112" font-size="88" font-weight="700" fill="#c9a5ff" letter-spacing="3">ORRERY SUITE</text>
    <text x="640" y="160" font-size="28" fill="#cfd1d2">Cradle's mix-bus processors, recreated and null-tested</text>
    <text x="640" y="392" font-size="20" fill="#8a8d8f" letter-spacing="1">VST3 · CLAP · AU · Standalone   ·   Windows, macOS &amp; Linux   ·   Free and open source</text>
  </g>
  </g>
</svg>
