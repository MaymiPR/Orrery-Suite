<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="512" height="512" role="img">
  <title>Newton Suite</title>
  <defs>
    <radialGradient id="steel" cx="0.36" cy="0.32" r="0.75">
      <stop offset="0" stop-color="#8b97b3"/><stop offset="0.45" stop-color="#3b4560"/><stop offset="1" stop-color="#151b2b"/>
    </radialGradient>
    <radialGradient id="particle" cx="0.4" cy="0.36" r="0.7">
      <stop offset="0" stop-color="#ffffff"/><stop offset="0.25" stop-color="#7ff0ff"/><stop offset="0.7" stop-color="#3fb8ff"/><stop offset="1" stop-color="#7a5cff"/>
    </radialGradient>
    <radialGradient id="halo">
      <stop offset="0" stop-color="#7fd8ff" stop-opacity=".55"/><stop offset="0.5" stop-color="#b07cff" stop-opacity=".18"/><stop offset="1" stop-color="#b07cff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="trail" gradientUnits="userSpaceOnUse" x1="126" y1="124" x2="164" y2="113">
      <stop offset="0" stop-color="#ff4fc8" stop-opacity="0"/><stop offset="1" stop-color="#b07cff" stop-opacity=".9"/>
    </linearGradient>
  </defs>
  <rect width="200" height="200" rx="44" fill="#0a0d18"/>
  <rect x="2" y="2" width="196" height="196" rx="42" fill="none" stroke="#23293d" stroke-width="3"/>
  <g transform="translate(2 18)">
  <!-- the frame's top bar and the strings -->
  <rect x="30" y="40" width="116" height="7" rx="3.5" fill="#c3cbdc"/>
  <g stroke="#5b6683" stroke-width="2" stroke-linecap="round">
    <path d="M46 47V114M66 47V114M86 47V114M106 47V114"/>
    <path d="M126 47L162.1 115.0"/>
  </g>
  <ellipse cx="88" cy="140" rx="62" ry="3" fill="#000" opacity=".45"/>
  <!-- four at rest -->
  <g fill="url(#steel)" stroke="#0a0d18" stroke-width="1.5">
    <circle cx="46" cy="124" r="10"/><circle cx="66" cy="124" r="10"/><circle cx="86" cy="124" r="10"/><circle cx="106" cy="124" r="10"/>
  </g>
  <!-- the fifth swung out, a particle with its path behind it -->
  <path d="M126 124 A77 77 0 0 0 162.1 115.0" fill="none" stroke="url(#trail)" stroke-width="3" stroke-linecap="round" stroke-dasharray="1 7"/>
  <circle cx="126" cy="124" r="10" fill="none" stroke="#ff4fc8" stroke-opacity=".35" stroke-width="1.5" stroke-dasharray="2 3"/>
  <circle cx="162.1" cy="115.0" r="24" fill="url(#halo)"/>
  <circle cx="162.1" cy="115.0" r="10" fill="url(#particle)"/>
  </g>
</svg>
